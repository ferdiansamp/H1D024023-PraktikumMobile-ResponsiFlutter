name: cuaca_app
description: "Aplikasi cuaca berbasis Open-Meteo API dengan arsitektur MVVM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State management untuk ViewModel (ChangeNotifier + Provider)
  provider: ^6.1.2

  # SDK resmi komunitas untuk Open-Meteo (Forecast API & Geocoding API)
  open_meteo: ^3.0.0

  # Local storage (fork Hive yang masih aktif dirawat, API-nya sama dengan Hive)
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
